# Publica na VPS por SSH.
#
# Dispara sozinho a cada push na master — a branch padrão deste repositório é
# master, não main —, e pode ser disparado à mão pela aba Actions do GitHub
# (botão "Run workflow"), escolhendo a branch.
#
# Precisa de três segredos em Settings > Secrets and variables > Actions:
#   VPS_HOST      endereço da VPS
#   VPS_USER      usuário do SSH
#   VPS_SSH_KEY   chave PRIVADA cuja pública está no authorized_keys da VPS
# E, opcionais:
#   VPS_PORT         porta do SSH (padrão 22)
#   VPS_KNOWN_HOSTS  saída de `ssh-keyscan -H <host>`, para fixar a identidade
#                    do servidor. Sem ele o primeiro acesso é aceito às cegas.
#                    Vale a pena preencher: é o que impede o deploy de entregar
#                    a chave privada a um servidor que se passe pelo nosso.
#                    Se o `ssh-keyscan` da sua máquina reclamar de KEX (o do
#                    Windows é antigo demais para o OpenSSH 8.9 da VPS), montar
#                    as linhas a partir do próprio servidor dá no mesmo:
#                      ssh root@<host> 'cut -d" " -f1,2 /etc/ssh/ssh_host_*.pub'
#                    e prefixar cada linha com o endereço.
#
# A conexão do runner até a VPS falha por timeout de vez em quando, sem que nada
# chegue ao sshd do servidor — é a rede no caminho, não o servidor recusando.
# Por isso a publicação tenta até 4 vezes antes de desistir, e só repete quando o
# ssh não conectou (código 255): erro vindo do próprio script remoto não se
# resolve repetindo.
#
# A chave do deploy é PRÓPRIA, não a pessoal do professor: assim revogar o
# acesso das Actions é apagar uma linha do authorized_keys, sem derrubar o
# acesso de ninguém mais. A linha é a que termina em
# "github-actions-deploy-englishforall".

name: Publicar na VPS

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch a publicar'
        required: true
        default: 'master'

concurrency:
  # Dois deploys ao mesmo tempo deixariam o servidor em estado indefinido.
  group: deploy-vps
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preparar a chave SSH
        env:
          CHAVE: ${{ secrets.VPS_SSH_KEY }}
          CONHECIDOS: ${{ secrets.VPS_KNOWN_HOSTS }}
          MAQUINA: ${{ secrets.VPS_HOST }}
          PORTA: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${CHAVE:-}" ]; then
            echo "::error::Falta o segredo VPS_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${CONHECIDOS:-}" ]; then
            printf '%s\n' "$CONHECIDOS" > ~/.ssh/known_hosts
          else
            # Sem VPS_KNOWN_HOSTS a identidade do servidor é aceita no
            # primeiro acesso e travada dali em diante.
            ssh-keyscan -p "${PORTA:-22}" -H "$MAQUINA" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Publicar e conferir
        env:
          MAQUINA: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          PORTA: ${{ secrets.VPS_PORT }}
          REF: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Publicando '$REF' em $MAQUINA"

          # O que roda no servidor vai para um arquivo em vez de ficar colado na
          # linha do ssh: assim a mesma coisa pode ser reenviada numa segunda
          # tentativa sem duplicar o texto.
          cat > /tmp/remoto.sh <<'REMOTO'
          set -euo pipefail
          cd /var/www/banco-questoes

          antes=$(git rev-parse HEAD)
          echo "Estava em: $antes"

          git fetch --prune origin "$REF"

          # --ff-only de propósito: se o que está no servidor divergiu do que
          # está no GitHub, o deploy PARA em vez de sobrescrever. Nada de
          # reset --hard aqui — ele apagaria silenciosamente o que houvesse
          # de diferente na VPS.
          git checkout "$REF" 2>/dev/null || git checkout -b "$REF" "origin/$REF"
          git merge --ff-only "origin/$REF"

          echo "Agora em:  $(git rev-parse HEAD)"

          # Só mexe em dependências se o package-lock tiver mudado.
          #
          # O `npm ci` PRECISA rodar com o node20, e não com o node do sistema.
          # O better-sqlite3 é módulo nativo: compilado contra o v22 do PATH, ele
          # deixa de carregar no v20 que a aplicação usa, o serviço entra em
          # laço de reinício e o site cai. Aconteceu em 06/08/2026, na primeira
          # vez que uma dependência mudou desde que este deploy existe.
          #
          # `npm` é um programa JS e roda com o primeiro `node` do PATH. Como só
          # existe o binário `node20`, criamos um `node` apontando para ele numa
          # pasta temporária e a colocamos na frente do PATH.
          if ! git diff --quiet "$antes" HEAD -- package-lock.json package.json; then
            echo "Dependências mudaram, instalando com o node20…"
            mkdir -p /tmp/n20bin
            ln -sf /usr/local/bin/node20 /tmp/n20bin/node
            PATH=/tmp/n20bin:$PATH npm ci --omit=dev
            rm -rf /tmp/n20bin
            # prova que o módulo nativo carrega ANTES de reiniciar o serviço
            NODE_PATH=/var/www/banco-questoes/node_modules /usr/local/bin/node20 \
              -e "require('better-sqlite3'); console.log('better-sqlite3 carrega no node20')"
          fi

          systemctl restart banco-questoes

          # A conferência é aqui dentro, e não numa segunda conexão: cada ssh
          # novo é mais uma chance de tomar o timeout de rede que derrubou dois
          # deploys em 06/08/2026. Uma conexão faz tudo.
          #
          # O restart não é instantâneo: tenta por até ~30 s antes de desistir.
          codigo=
          for i in $(seq 1 15); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/ || true)
            if [ "$codigo" = "200" ]; then break; fi
            sleep 2
          done
          if [ "$codigo" != "200" ]; then
            echo "O site não respondeu 200 (último código: ${codigo:-nenhum})."
            systemctl status banco-questoes --no-pager --lines 30 || true
            journalctl -u banco-questoes --no-pager --lines 40 || true
            exit 1
          fi
          echo "Site respondeu 200. Publicado."
          REMOTO

          publicar() {
            ssh -i ~/.ssh/id_deploy -p "${PORTA:-22}" \
                -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
                "$USUARIO@$MAQUINA" "REF='$REF' bash -s" < /tmp/remoto.sh
          }

          # Em 06/08/2026 o deploy falhou duas vezes com "connect ... timed out",
          # e o sshd do servidor não registrou nenhuma tentativa nos horários: os
          # pacotes do runner não chegaram. Não é o servidor recusando (não há
          # fail2ban nem regra bloqueando a 22) — é a rede no caminho. Contra
          # isso insistir funciona; desistir na primeira só transfere o trabalho
          # para alguém publicar à mão.
          for tentativa in 1 2 3 4; do
            codigo=0
            publicar || codigo=$?
            if [ "$codigo" -eq 0 ]; then exit 0; fi

            # 255 é falha do próprio ssh — não conectou, nada rodou no servidor.
            # Qualquer outro código veio do script remoto, e repetir um merge
            # recusado ou um site que não sobe não conserta nada.
            if [ "$codigo" -ne 255 ]; then
              echo "::error::O script no servidor falhou (código $codigo). Não vou repetir."
              exit "$codigo"
            fi

            if [ "$tentativa" -lt 4 ]; then
              espera=$((tentativa * 20))
              echo "Não consegui conectar (tentativa $tentativa de 4). De novo em ${espera}s."
              sleep "$espera"
            fi
          done

          echo "::error::A VPS não aceitou conexão em 4 tentativas. Publique à mão com o publicar-a-mao.sh do repositório EnglishforALL-vps."
          exit 1

      - name: Apagar a chave
        if: always()
        run: rm -f ~/.ssh/id_deploy
