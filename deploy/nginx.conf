# /etc/nginx/sites-available/ingles-destruitor
# Proxy reverso para o Node na porta 8098.
#
#   ln -s /etc/nginx/sites-available/ingles-destruitor /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ingles.destruitor.com.br

server {
    listen 80;
    listen [::]:80;
    server_name ingles.destruitor.com.br;

    client_max_body_size 8M;   # upload de imagem das questões

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Imagens enviadas: servidas direto pelo nginx, sem passar pelo Node.
    location /uploads/ {
        alias /var/www/banco-questoes/public/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location /css/ {
        alias /var/www/banco-questoes/public/css/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
